services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

    environment:
      NODE_ENV: development

    command: npm run dev -- --host 0.0.0.0

volumes:
  frontend_node_modules: